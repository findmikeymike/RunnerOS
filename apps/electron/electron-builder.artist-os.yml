extends: ./electron-builder.yml

appId: com.findmikeymike.artistos
productName: Artist OS
copyright: Copyright © 2026 Artist OS
artifactName: Artist-OS-${version}-${arch}.${ext}

directories:
  output: release-artist-os
  buildResources: resources

extraMetadata:
  main: dist/main.cjs
  productName: Artist OS
  description: Agentic operating system for independent artists and music teams

publish:
