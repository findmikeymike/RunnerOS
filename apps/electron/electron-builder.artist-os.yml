  artifactName: Artist-OS-${version}-${arch}.${ext}

linux:
  icon: resources/artist-os-icon.png
  artifactName: Artist-OS-${version}-${arch}.${ext}
  maintainer: Artist OS <support@artistos.local>

dmg:
  artifactName: Artist-OS-${version}-${arch}.dmg
  icon: resources/artist-os-icon.icns
  title: Artist OS
