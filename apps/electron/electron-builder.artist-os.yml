extends: ./electron-builder.common.yml

appId: com.findmikeymike.artistos
productName: Artist OS
copyright: Copyright © 2026 Artist OS
artifactName: Artist-OS-${version}-${arch}.${ext}

protocols:
  - name: Artist OS URL
    schemes:
      - artistos

directories:
  output: release-artist-os
  buildResources: resources

beforePack: scripts/beforePack.cjs

# The embedded gateway is Artist OS-only. Prepare its production dependency
# tree at package time, then copy it outside the app's excluded node_modules.
extraResources:
  - from: vendor/omniroute-runtime
    to: app/omniroute-runtime
    filter:
      - "package.json"
      - "package-lock.json"
      - "node_modules/**/*"

extraMetadata:
  main: dist/main.cjs
  productName: Artist OS
  description: Agentic operating system for independent artists and music teams

publish:
  provider: generic
  url: https://github.com/findmikeymike/ArtistOS/releases/latest/download

mac:
  icon: resources/artist-os-icon.icns
  artifactName: Artist-OS-${version}-${arch}.${ext}
  extendInfo:
    # Artist OS does not receive Runner's Assets.car in afterPack; retain its .icns fallback.
    CFBundleIconName: null
    NSMicrophoneUsageDescription: Artist OS uses your microphone only when you choose dictation in chat.

win:
  icon: resources/artist-os-icon.ico
  artifactName: Artist-OS-${version}-${arch}.${ext}

linux:
  icon: resources/artist-os-icon.png
  artifactName: Artist-OS-${version}-${arch}.${ext}
  maintainer: Artist OS <support@artistos.local>

dmg:
  artifactName: Artist-OS-${version}-${arch}.dmg
  icon: resources/artist-os-icon.icns
  title: Artist OS
