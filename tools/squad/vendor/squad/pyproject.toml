[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squad"
version = "0.1.0"
description = "First-loop business and marketing agent system."
requires-python = ">=3.11"
dependencies = [
  "fal-client>=0.7,<1.0",
  "langgraph>=0.2,<1.0",
  "openai>=1.0,<2.0",
  "pillow>=10.0,<13.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
caption-align = [
  "whisperx>=3.8,<4.0",
]
durable = [
  "dbos>=2.18,<3.0",
]

[tool.setuptools.packages.find]
include = [
  "agents*",
  "content*",
  "core*",
  "creative*",
  "memory*",
  "workers*",
  "workflows*",
]
exclude = [
  "tmp*",
  "tests*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
