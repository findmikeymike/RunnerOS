# Era Styles
# Visual aesthetics inspired by specific time periods and film formats

vhs_camcorder:
  id: vhs_camcorder
  name: "VHS/Camcorder"
  category: era
  description: "Home video aesthetic, worn tape texture, lo-fi warmth, crushed blacks, analog distortion, nostalgic memory flashback"

  visual:
    color_grade: "warm oversaturated, blown-out highlights, color bleeding, slight magenta-cyan shift, faded blacks"
    lighting: "harsh on-camera flash, overexposed faces, fluorescent hum, living-room lamps"
    texture: "tracking lines, VHS noise, timestamp overlay, tape wear, scan lines, chroma bleeding, drop-frame tears, static bursts, VHS snow"
    contrast: "crushed, limited dynamic range, analog compression artifacts"

  mood:
    primary: "nostalgic"
    secondary: ["amateur", "lo-fi", "intimate", "found footage", "flashback"]
    energy: "casual, spontaneous, analog memory"

  camera:
    movement: "shaky handheld, tape wobble, sudden zooms, pause-record glitches"
    framing: "imperfect, off-center, accidental cropping, documentary snapshot"
    angles: "varied, unstable, shoulder-mounted camcorder"

  prompt_prefix: "extremely worn VHS camcorder footage, late 80s/90s home video aesthetic, lo-fi analog warmth, severe tape grain and VHS snow, rolling tracking lines, horizontal signal tearing, timestamp overlay text with date/time, chroma bleed, color fringing, warped blacks, blown-out highlights, buzzing static in shadows, fuzzy soft focus, handheld jitter, pause-record glitches, dropout artifacts, nostalgic flashback energy, cozy interior lighting, analog distortion everywhere"

  negative_prompt: "clean digital, pristine focus, HDR, cinematic lighting, modern camera, crisp edges, glossy CGI, UHD clarity"

  kling_motion_hints:
    - "shaky handheld wobble"
    - "sudden amateur reframing and zoom"
    - "tracking distortion sweep"
    - "pause-record glitch stutter"


