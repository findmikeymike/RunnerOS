# Artistic Styles
# 2025-12-15 (updated)
# Pure artistic rendering styles for consistent, stylized imagery
# Includes grungy 90s photo styles for Midjourney v6

# ============================================
# GRUNGY 90s PHOTO STYLES (Best with Midjourney v6)
# ============================================

grungy_90s:
  id: grungy_90s
  name: "Grungy 90s Photo"
  category: photo_artistic
  description: "Disposable camera aesthetic, film grain, desaturated colors, urban decay, grunge era vibes"

  visual:
    color_grade: "desaturated, muted colors, green/yellow tint, faded blacks"
    lighting: "harsh flash, overexposed highlights, deep shadows, light leaks"
    texture: "heavy film grain, dust particles, scratches, vignette"
    contrast: "crushed blacks, blown highlights, lo-fi quality"

  mood:
    primary: "nostalgic"
    secondary: ["raw", "authentic", "gritty", "melancholic"]
    energy: "restless, angsty, introspective"

  prompt_prefix: "90s disposable camera photo, heavy film grain, desaturated colors, flash photography, lo-fi aesthetic, grunge era, urban decay, authentic candid moment, Kodak Gold 400 film, light leaks, vignette edges"

  negative_prompt: "digital, clean, sharp, modern, HDR, oversaturated, professional lighting, studio shot, polished"

  kling_motion_hints:
    - "subtle camera shake"
    - "film flicker effect"
    - "slow deliberate movement"
    - "handheld documentary feel"


polaroid_grunge:
  id: polaroid_grunge
  name: "Polaroid Grunge"
  category: photo_artistic
  description: "Instant film aesthetic with grunge textures, washed out colors, nostalgic imperfection"

  visual:
    color_grade: "warm yellow cast, faded pastels, low saturation, creamy whites"
    lighting: "soft diffused, overexposed center, dark corners"
    texture: "polaroid border, chemical imperfections, dust, fingerprints"
    contrast: "low contrast, milky shadows, soft highlights"

  mood:
    primary: "dreamy"
    secondary: ["nostalgic", "intimate", "fleeting", "vulnerable"]
    energy: "quiet, contemplative, bittersweet"

  prompt_prefix: "polaroid instant photo, faded colors, warm yellow tint, soft focus, chemical imperfections, white border frame, 90s nostalgia, intimate candid shot, Polaroid 600 film, light leak artifacts"

  negative_prompt: "digital, sharp, modern, clean, professional, studio lighting, HDR, oversaturated"

  kling_motion_hints:
    - "gentle sway"
    - "soft focus drift"
    - "subtle light flicker"
    - "dreamy slow motion"


vhs_aesthetic:
  id: vhs_aesthetic
  name: "VHS Aesthetic"
  category: photo_artistic
  description: "Video tape degradation, tracking lines, RGB shift, analog warmth"

  visual:
    color_grade: "oversaturated reds, bleeding colors, warm analog tint"
    lighting: "CRT glow, scan lines visible, blooming highlights"
    texture: "tracking errors, horizontal lines, tape noise, RGB chromatic aberration"
    contrast: "boosted, crushed blacks, glowing whites"

  mood:
    primary: "retro"
    secondary: ["eerie", "nostalgic", "degraded", "hypnotic"]
    energy: "unsettling, hypnotic, time-displaced"

  prompt_prefix: "VHS tape aesthetic, scan lines, tracking errors, RGB color shift, analog video noise, 90s camcorder footage, tape degradation, CRT monitor glow, chromatic aberration, retro video artifact"

  negative_prompt: "digital, clean, 4K, modern, sharp, professional video, HD quality"

  kling_motion_hints:
    - "VHS tracking glitch"
    - "scan line flicker"
    - "tape wobble effect"
    - "analog distortion pulse"


