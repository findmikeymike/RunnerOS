  prompt_prefix: "sumi-e ink wash painting, flowing black ink on rice paper, zen minimalism, wet brush strokes, ink bleeding at edges, vast negative space, calligraphic quality, Japanese brush painting aesthetic"

  negative_prompt: "color, photorealistic, busy composition, sharp lines, digital, 3D render, cluttered"

