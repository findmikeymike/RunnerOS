# Raw & Authentic Styles
# 2025-01-05
# Styles focused on artistic authenticity over polish
# Every style here should scream "intentional art" not "AI trying to look real"

# ============================================
# HAND-DRAWN & ANIMATION
# ============================================

rotoscope_raw:
  id: rotoscope_raw
  name: "Raw Rotoscope"
  category: hand_drawn
  description: "Rough rotoscoped animation, A-ha Take On Me aesthetic but rawer, more gestural"

  visual:
    color_grade: "limited palette, 2-3 colors max, high contrast black outlines"
    lighting: "flat shading, cel-shaded shadows, no realistic lighting"
    texture: "hand-drawn line weight variation, sketch quality, paper texture"
    contrast: "high, bold black against color"

  mood:
    primary: "dynamic"
    secondary: ["raw", "energetic", "nostalgic", "artistic"]
    energy: "kinetic, hand-crafted"

  prompt_prefix: "raw rotoscoped animation frame, bold irregular ink outlines tracing form, hand-drawn cel animation, visible pen strokes with varying pressure, animation frame with sketch quality, limited flat color palette, A-ha Take On Me aesthetic"

  negative_prompt: "photorealistic, 3D render, photograph, smooth gradients, digital clean lines, realistic shading, natural colors, CGI"

  kling_motion_hints:
    - "subtle hand-drawn line wobble"
    - "ink lines breathing slightly"
    - "animation frame jitter"
    - "sketch lines shifting imperceptibly"


charcoal_expressive:
  id: charcoal_expressive
  name: "Expressive Charcoal"
  category: hand_drawn
  description: "Raw charcoal and graphite, smudged and unfinished, emotionally expressive"

  visual:
    color_grade: "monochrome, deep blacks, bright paper whites, grey gradations"
    lighting: "pure value contrast, no color, dramatic light and shadow"
    texture: "heavy charcoal grain, smudged edges, visible paper tooth, gestural marks"
    contrast: "extreme, rich blacks against raw paper"

  mood:
    primary: "raw"
    secondary: ["intense", "vulnerable", "expressive", "unfinished"]
    energy: "urgent, gestural, immediate"

  prompt_prefix: "expressive charcoal sketch on rough paper, heavy graphite marks, smudged edges, raw unfinished quality, visible paper texture, dramatic black and white values, gestural drawing, artist sketch study"

  negative_prompt: "color, photorealistic, clean lines, digital, smooth gradients, polished, 3D render, photograph"

  kling_motion_hints:
    - "charcoal dust settling"
    - "subtle paper texture shift"
    - "smudge marks breathing"
    - "static with grain movement"


ink_wash_minimal:
  id: ink_wash_minimal
  name: "Minimal Ink Wash"
  category: hand_drawn
  description: "Sumi-e inspired, flowing black ink, zen minimalism, negative space"

  visual:
    color_grade: "black ink gradients on cream/white, no color, ink density variations"
    lighting: "no realistic lighting, ink defines form"
    texture: "rice paper grain, wet brush edges, ink pooling, calligraphic strokes"
    contrast: "high where ink meets paper, soft gradients within washes"

  mood:
    primary: "contemplative"
    secondary: ["zen", "minimal", "elegant", "quiet"]
