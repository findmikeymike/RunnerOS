name: Tests

# The repo has ~7,900 passing tests across 313 files that `validate.yml` never
# ran — it covers typecheck, three shared test files, and doc tools. Everything
# else went unchecked, which is how 68 real failures accumulated without anyone
# being careless: nothing was looking.
#
# macOS is not optional here. The most expensive bug found so far — SVG text
# rendering stalling 20-45s per call — is macOS-only, so a Linux-only gate
# cannot see that whole class. Windows should join this matrix when that build
# target lands.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} shard ${{ matrix.shard }}/6
    runs-on: ${{ matrix.os }}
    # A hung suite is a real failure mode here, not a hypothetical: running
    # server-core in one process wedges partway through and never exits.
    # Sharding avoids it; this cap makes sure a future one fails fast instead
    # of burning the job's full six hours.
    timeout-minutes: 25

    strategy:
      # Every shard reports. Stopping at the first red would hide the rest of
      # the picture, which is the state this workflow exists to end.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4, 5, 6]

    env:
      # Pango's CoreText backend takes 20-45s to rasterize SVG text on macOS.
      # See packages/shared/src/config/pango-backend.ts — Bun does not
      # propagate process.env to native libraries, so it has to be set here
      # rather than in code. Harmless on Linux, which already defaults to it.
      PANGOCAIRO_BACKEND: fontconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # `--shard` is required below and is not in 1.3.10, which
          # validate.yml pins.
          bun-version: "1.3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same ignores as the root `test` script. A packaged build under
      # apps/electron/release-artist-os holds ~490 copied test files. They are
      # gitignored so CI never sees them, but a bare local run executes the
      # copies and reports phantom failures from inside "Artist OS.app" — that
      # accounted for 50 of the 68 failures first counted here. Matching the
      # two keeps local and CI measuring the same thing.
      - name: Run tests
        run: bun test --shard=${{ matrix.shard }}/6 --path-ignore-patterns='**/release-artist-os/**' --path-ignore-patterns='**/dist/**'
